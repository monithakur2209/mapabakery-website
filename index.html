<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MAPA Bakery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Order fresh Cakes and Cupcakes from MAPA Bakery." />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" />

  <style>
    :root {
      --primary: #c96b7b;
      --primary-dark: #a55262;
      --accent: #ffe7ec;
      --bg: #fff9f7;
      --text: #333;
      --radius: 10px;
      --shadow: 0 8px 20px rgba(0,0,0,0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      background: #fff;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .nav {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1.5rem;
    }

    .logo {
      font-weight: 700;
      font-size: 1.3rem;
      color: var(--primary-dark);
    }

    .nav-links a {
      margin-left: 1rem;
      text-decoration: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .nav-links a:hover { color: var(--primary); }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 10px rgba(201,107,123,0.4);
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    /* Hero */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-top: 2rem;
    }

    .hero-text p {
      font-style: italic;
      font-size: 1.4rem;
      color: #5a4636;
      line-height: 1.8;
    }

    /* Sections */
    section { margin-top: 3rem; }
    section h2 {
      font-size: 1.6rem;
      margin-bottom: 0.8rem;
      color: var(--primary-dark);
    }
    section p.section-intro {
      font-size: 0.95rem;
      margin-bottom: 1.2rem;
      color: #555;
    }

    /* ====== 4-Image Carousel Gallery ====== */
    .gallery-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .gallery-carousel {
      width: 100%;
      overflow: hidden;
    }

    .carousel-inner {
      display: flex;
      transition: transform 0.4s ease-in-out;
    }

    .carousel-item {
      width: 25%;
      padding: 0.5rem;
      box-sizing: border-box;
    }

    .carousel-img {
      width: 100%;
      height: 180px;
      background-size: cover;
      background-position: center;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .nav-btn {
      background: #c96b7b;
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.4rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(201,107,123,0.4);
    }

    .nav-btn:hover { background: #a55262; }

    @media (max-width: 768px) {
      .carousel-item { width: 50%; }
    }

    /* Order & Auth */
    .two-column {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 2rem;
    }

    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 1.2rem 1.4rem;
    }

    footer {
      margin-top: 3rem;
      padding: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: #777;
    }
  </style>
</head>

<body>
<header>
  <div class="nav">
    <div class="logo">MAPA Bakery</div>
    <nav class="nav-links">
      <a onclick="scrollToSection('home')">Home</a>
      <a onclick="scrollToSection('gallery')">Gallery</a>
      <a onclick="scrollToSection('order')">Order</a>
      <a onclick="scrollToSection('login')">Login</a>
    </nav>
  </div>
</header>

<main>

<!-- HERO -->
<section id="home" class="hero">
  <div class="hero-text">
    <h1>Bites of Happiness, Delivered.</h1>
    <p>
      At MAPA Bakery, we craft Cakes that delight both the eye and the taste buds...
    </p>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery">
  <h2>Gallery</h2>
  <p class="section-intro">
    A peek into some of our favourite creations. We also take fully custom orders.
  </p>

  <div class="gallery-wrapper">
    <button class="nav-btn" id="prevBtn">&#10094;</button>

    <div class="gallery-carousel">
      <div id="carouselInner" class="carousel-inner"></div>
    </div>

    <button class="nav-btn" id="nextBtn">&#10095;</button>
  </div>
</section>

<!-- ORDER SECTION -->
<section id="order">
  <!-- your existing order HTML unchanged -->
</section>

<!-- TRUST SECTION -->
<section id="trust">
  <!-- your existing trust HTML unchanged -->
</section>

</main>

<footer>
  &copy; <span id="year"></span> MAPA Bakery. All rights reserved.
</footer>

<!-- IMAGE MODAL -->
<div id="imageModal" style="
  display:none; position:fixed; top:0; left:0;
  width:100%; height:100%; background:rgba(0,0,0,0.8);
  justify-content:center; align-items:center; z-index:9999;">
  <img id="modalImage" style="max-width:90%; max-height:90%; border-radius:10px;">
</div>

<script>
function scrollToSection(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: "smooth" });
}

document.getElementById("year").textContent = new Date().getFullYear();
</script>

<!-- CAROUSEL GALLERY JS -->
<script>
let galleryItems = [];
let currentIndex = 0;
const itemsPerPage = 4;

async function loadCarousel() {
  try {
    const res = await fetch('gallery.json?_=' + Date.now());
    galleryItems = await res.json();
    renderCarousel();
  } catch (e) {
    console.error("Failed to load gallery:", e);
  }
}

function renderCarousel() {
  const carouselInner = document.getElementById("carouselInner");
  carouselInner.innerHTML = "";

  galleryItems.forEach(item => {
    const div = document.createElement("div");
    div.className = "carousel-item";
    div.innerHTML = `
      <div class="carousel-img"
           style="background-image:url('${item.image}')"
           onclick="openImageModal('${item.image}')">
      </div>
    `;
    carouselInner.appendChild(div);
  });

  updateCarousel();
}

function updateCarousel() {
  const carouselInner = document.getElementById("carouselInner");
  const offset = -(currentIndex * (100 / itemsPerPage));
  carouselInner.style.transform = `translateX(${offset}%)`;
}

document.getElementById("nextBtn").addEventListener("click", () => {
  if (currentIndex < galleryItems.length - itemsPerPage) {
    currentIndex++;
    updateCarousel();
  }
});

document.getElementById("prevBtn").addEventListener("click", () => {
  if (currentIndex > 0) {
    currentIndex--;
    updateCarousel();
  }
});

loadCarousel();
</script>

<script>
function openImageModal(src) {
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  modalImg.src = src;
  modal.style.display = "flex";
  modal.onclick = () => modal.style.display = "none";
}
</script>

</body>
</html>
